# Copy this file to .github/workflows/deploy-gh-pages.yml in your beads-tracking repo.
#
# Downloads a pre-built Big Top release tarball for fast deploys (~30s).
# Falls back to building from source if no release is found.
name: Deploy Big Top Dashboard

on:
  # Redeploy when JSONL data changes
  push:
    branches: [main]
    paths:
      - 'data/**'
  # Allow manual deploys
  workflow_dispatch:

# CHANGE THIS to match your repo name (used as the URL path prefix)
env:
  REPO_NAME: beads-tracking
  BIG_TOP_REPO: nicholasspencer/big-top

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Try downloading the latest pre-built release (fast path — no Flutter needed)
      - name: Download latest Big Top release
        id: release
        run: |
          TARBALL_URL=$(gh api "repos/${{ env.BIG_TOP_REPO }}/releases/latest" \
            --jq '.assets[] | select(.name | startswith("big-top-web-")) | .browser_download_url' \
            2>/dev/null) || true

          if [ -n "$TARBALL_URL" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            mkdir -p _site
            curl -sL "$TARBALL_URL" | tar -xzf - -C _site
            echo "Downloaded pre-built release from $TARBALL_URL"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No release found — will build from source"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback: build from source if no release tarball available
      - name: Checkout Big Top source
        if: steps.release.outputs.found == 'false'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BIG_TOP_REPO }}
          path: big-top
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        if: steps.release.outputs.found == 'false'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build from source
        if: steps.release.outputs.found == 'false'
        working-directory: big-top
        run: |
          flutter pub get
          flutter build web --release --base-href "/${{ env.REPO_NAME }}/"
          mkdir -p ../_site
          cp -r build/web/* ../_site/

      # Patch base-href in pre-built release to match this repo
      - name: Patch base-href
        if: steps.release.outputs.found == 'true'
        run: |
          sed -i 's|<base href="[^"]*">|<base href="/${{ env.REPO_NAME }}/">|' _site/index.html

      # Copy JSONL data into the site so the dashboard can read it
      - name: Copy data
        run: |
          if [ -d data ]; then
            cp -r data _site/data
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
