name: big_top
description: "Big Top — a beads dashboard for GitHub-synced issue tracking."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  state_notifier: ^1.0.0
  flutter_state_notifier: ^1.0.0
  go_router: ^14.8.1
  http: ^1.3.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.0
  freezed: ^3.2.5
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true
